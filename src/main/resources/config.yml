# Maximum tracked maces.
# -1 disables the cap and illegal-id enforcement. Storage rules below still apply.
# Explicit admin removals remain enforced, including after restarts.
# 0 allows none. A positive number caps tracked maces and removes maces without an id.
# Offline holders still count. Lowering a positive limit does not delete tracked maces.
allowed-maces: -1

# When false, maces cannot be placed in an enchanting table or an anvil.
allow-mace-enchanting: true

# Storage controls: true allows placement; false blocks placement.
# Allowed storage retains the recorded owner and counts toward the mace limit.
# Taking possession will transfer ownership; viewing storage will not.
# These controls apply independently of allowed-maces.
# Portable storage must also be allowed in every outer destination containing it.
# Disallowed stored maces are returned to a viewer or dropped nearby during cleanup.
# Unknown storage/workstation types are blocked; enchanting is controlled above.
# Chest and hopper options also cover vehicles with those inventory types.
# Only destinations supported by the server's Minecraft version can be used.
mace-storage:
  ender-chests: true
  # Requires a server version with shelves; includes direct and powered hotbar swaps.
  shelves: true
  item-frames: true
  glow-item-frames: true
  chests: false
  barrels: false
  shulker-boxes: false
  bundles: false
  armor-stands: false
  hoppers: false
  droppers: false
  dispensers: false
  decorated-pots: false
  # Allows storage in crafter slots, not automated crafting of tracked maces.
  crafters: false

broadcasts:
  # Set true to announce when a player crafts a tracked mace.
  # Edit messages.crafted-broadcast below to customize the announcement.
  crafted: false

cooldown:
  # Vanilla has no extra mace cooldown beyond the attack-speed bar. Set true to add one.
  enabled: false
  # Thorns armor still deals its reflected damage.
  # That hit does not start or refresh the mace cooldown, and a cooldown does not cancel it.
  ignore-thorns: true
  # Extra seconds after a real main-hand mace swing. 0 matches vanilla.
  # Enchantment modifiers below are added on top once the cooldown is enabled.
  # /maces setcooldown <seconds> also enables cooldowns when seconds is positive.
  base-seconds: 0
  minimum-seconds: 0
  maximum-seconds: 600
  # Seconds added or removed per level on the mace. Negative numbers shorten the cooldown.
  # Set a value to 0 to ignore that enchantment.
  mace-enchantments:
    density: 0
    breach: 0
    wind_burst: 0
  # Seconds added or removed per level on each worn armor piece.
  # Protection IV on a helmet and a chestplate counts as two pieces.
  armor-enchantments:
    protection: 0
    blast_protection: 0
    projectile_protection: 0
    fire_protection: 0
    feather_falling: 0
    # Extra seconds per Thorns level when swinging a mace. This does not change Thorns damage.
    # Leave at 0 so wearing Thorns does not lengthen the swing cooldown.
    thorns: 0

# Optional wind-charge cooldown. It does not use the enchantment modifiers.
wind-charge:
  enabled: false
  seconds: 30

# Scan budgets are cooperative: a single inventory or chunk query can exceed the time limit.
# Confirming an apparently missing record and capturing chunk unloads use same-tick
# safety checks, which may also exceed this budget.
performance:
  scan-units-per-tick: 32
  scan-budget-ms: 2.0
  # Event-driven checks run every 20 ticks; full audits catch commands/other plugins.
  full-audit-ticks: 1200
  # SQLite writes are batched until the next tick. Enable background writes only
  # after measuring registry latency. Requires a plugin/server restart.
  async-registry-writes: false
  # Optional Paper snapshot-free states; Bukkit/Spigot fall back automatically.
  paper-direct-states: false
  # Log observed maximum scan/audit/write durations on disable.
  log-timings: false

messages:
  prefix: "&6[MaceManager]&r "
  # Crafting announcement. Supports & colors and %player%, %current%, %max%, %amount%, %lastHolder%.
  # Remove %player% from this message to announce crafting without naming the player.
  crafted-broadcast: "&a%player% &7crafted a mace. &7(%current%/%max%)"
  destroyed-broadcast: "&cA mace was destroyed. &7(last held by &f%lastHolder%&7) &7(%current%/%max%)"
  containers-blocked: "&cYou can't put the mace in this storage."
  limit-reached: "&cMace limit reached. A mace must be destroyed before another can be crafted."
  illegal-removed: "&cAn illegal mace was removed."
  enchanting-blocked: "&cMaces cannot be enchanted."
  reload: "&aMaceManager config reloaded."
  no-permission: "&cYou don't have permission."
  cooldown-applied: "&cMace cooldown: &f%seconds%s"
  cooldown-active: "&cMace is on cooldown for &f%seconds%s&c."
  wind-charge-active: "&cWind charge is on cooldown for &f%seconds%s&c."
  list-header: "&6Maces: &f%current%&7/&f%max%"
  list-holder: "&7- &f%player% &7(%state%) &8%id%"
  list-without: "&7- &f%player% &7has no mace"
  list-none: "&7No tracked maces."
  setlimit: "&aMace limit set to &f%limit%&a."
  setcooldown: "&aBase mace cooldown set to &f%seconds%s&a."
  enchanting-on: "&aMace enchanting enabled."
  enchanting-off: "&cMace enchanting disabled."
  sweep-started: "&7Removal queued. Completion will be reported after the loaded-world sweep."
  sweep-failed: "&cRemoval sweep failed; check the server log before retrying."
  removed: "&aRemoved mace &f%id%&a."
  not-found: "&cNo mace with that id."
  ambiguous-id: "&cThat id matches more than one mace."
  gave-untracked: "&aGave an untracked mace."
  cleared-untracked: "&aRemoved &f%amount% &auntracked mace(s)."
  players-only: "&cOnly players can use that command."
  usage: "&cUsage: &f%usage%"
